name: Zorro v4 search tests
on:
  push:
    branches: [zorro-hybrid-search-v4]
  pull_request:
    branches: [main]
jobs:
  search-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install psycopg2-binary
      - name: Compile v4 modules
        run: python -m py_compile main.py search_v4.py conversation_v4.py test_search_v4.py
      - name: Run offline catalog regression tests
        run: python -m unittest -v test_search_v4.py
